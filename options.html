<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selection Text Reader Settings</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="options-page">
    <main class="options">
      <h1 class="brand-title"><img class="brand-icon" src="assets/icons/icon-16.png" srcset="assets/icons/icon-32.png 2x" width="16" height="16" alt=""><span data-i18n="settingsTitle">Reading Settings</span></h1>

      <form id="settingsForm">
        <button id="backButton" class="back-button" type="button" data-i18n="back" hidden>Back</button>

        <label>
          <span data-i18n="interfaceLanguage">Interface language</span>
          <select id="uiLanguage" name="uiLanguage">
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="th">ภาษาไทย</option>
            <option value="ms">Bahasa Melayu</option>
          </select>
        </label>

        <label class="toggle-row">
          <input id="autoDetectLanguage" name="autoDetectLanguage" type="checkbox">
          <span data-i18n="autoDetect">Automatically detect selected text language</span>
        </label>

        <label class="toggle-row">
          <input id="showSelectionButton" name="showSelectionButton" type="checkbox">
          <span data-i18n="showSelectionButton">Show the on-page selection button</span>
        </label>

        <label>
          <span data-i18n="fallbackLanguage">Fallback language</span>
          <select id="lang" name="lang">
            <option value="zh-CN">Chinese (Mandarin)</option>
            <option value="zh-TW">Chinese (Taiwan)</option>
            <option value="zh-HK">Chinese (Hong Kong)</option>
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="ja-JP">Japanese</option>
            <option value="ko-KR">Korean</option>
          </select>
        </label>

        <div class="engine-info">
          <span data-i18n="systemVoiceEngine">Detected system voice engine</span>
          <strong id="systemEngine"></strong>
        </div>

        <label>
          <span data-i18n="defaultVoice">Default voice</span>
          <select id="voiceName" name="voiceName">
            <option value="" data-i18n="automatic">Automatic</option>
          </select>
        </label>

        <fieldset>
          <legend data-i18n="voicesByLanguage">Voices by language</legend>
          <div class="voice-grid">
            <label><span data-i18n="chinese">Chinese</span><select class="language-voice" data-language="zh"><option value="" data-i18n="useDefault">Use default</option></select></label>
            <label><span data-i18n="english">English</span><select class="language-voice" data-language="en"><option value="" data-i18n="useDefault">Use default</option></select></label>
            <label><span data-i18n="japanese">Japanese</span><select class="language-voice" data-language="ja"><option value="" data-i18n="useDefault">Use default</option></select></label>
            <label><span data-i18n="korean">Korean</span><select class="language-voice" data-language="ko"><option value="" data-i18n="useDefault">Use default</option></select></label>
          </div>
        </fieldset>

        <label>
          <span data-i18n="ocrLanguage">Screen OCR language</span>
          <select id="ocrLanguage" name="ocrLanguage">
            <option value="eng">English</option>
            <option value="chi_sim">Chinese (Simplified)</option>
            <option value="chi_tra">Chinese (Traditional)</option>
            <option value="eng+chi_sim">English + Simplified Chinese</option>
            <option value="eng+chi_tra">English + Traditional Chinese</option>
            <option value="jpn+eng">Japanese + English</option>
            <option value="kor+eng">Korean + English</option>
          </select>
        </label>

        <label>
          <span data-i18n="speed">Speed</span>
          <input id="rate" name="rate" type="range" min="0.5" max="2" step="0.1">
          <span id="rateValue"></span>
        </label>

        <label>
          <span data-i18n="pitch">Pitch</span>
          <input id="pitch" name="pitch" type="range" min="0" max="2" step="0.1">
          <span id="pitchValue"></span>
        </label>

        <label>
          <span data-i18n="volume">Volume</span>
          <input id="volume" name="volume" type="range" min="0" max="1" step="0.1">
          <span id="volumeValue"></span>
        </label>

        <div class="actions">
          <button type="submit" data-i18n="saveSettings">Save settings</button>
          <button id="testButton" type="button" data-i18n="testVoice">Test voice</button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>

        <a class="repository-link" href="https://github.com/ShadowsLunarfox/Text-to-Speech-Browser-Extension" target="_blank" rel="noopener noreferrer" data-i18n="repository">GitHub repository</a>
      </form>
    </main>
    <script src="i18n.js"></script>
    <script src="options.js"></script>
  </body>
</html>
